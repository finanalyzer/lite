services:
  lite:
    image: openbblite/lite:dev
    pull_policy: never
    ports:
      - "${OPENBB_LITE_PORT:-3000}:3000"
    volumes:
      - lite-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  lite-data:
